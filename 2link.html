<!DOCTYPE html>
<html>
<head>
<style>
a:link, a:visited {
  background-color: #ddc31a;
  color: white;
  padding: 14px 25px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
}

a:hover, a:active {
  background-color: rgb(148, 31, 238);
}
</style>
</head>
<body>

<h2>Link Button</h2>

<p>A link styled as a button:</p>
<a href="font.html">This is a link</a>

</body>
</html>
