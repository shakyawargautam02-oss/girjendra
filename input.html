<form action="">
    <label for="Birthday">Birthday</label>
    <input type="date" id="Birthday" name="Birthday">
    <input type="submit" value="submit">
</form>
<br><br><br>
<form action="">
    <label for="datemin" >Enter a date after 2000-01-01:</label>
     <input type="date" id="datemin" name="datemin" min="2000-01-01">
     <br><br>

     <label for="datemax">Enter a date before 1980-01-01:</label>
     <input type="date" id="datemax" name="datemax" max="1000-12-31">
     <br>
     <input type="submit" value="submit">
</form>


<form action="">
    <label for="birthday time">Birthday (Date and Time)</label>
    <input type="datetime-local" id="birthday time" name="birthday time">
    <input type="submit" value="submit">
</form>

<br><br>

<form action="">
    <label for="Email">Email ID</label>
    <input type="email" id="Email" name="Email">
    <input type="submit" value="submit">
</form>
